[general]
import = [
    "~/.config/alacritty/themes/noctalia.toml"
]

[font.normal]
family = "CaskaydiaCove Nerd Font"
style = "Regular"

[font.bold]
family = "CaskaydiaCove Nerd Font"
style = "Bold"

[font.italic]
family = "CaskaydiaCove Nerd Font"
style = "Italic"

[font.bold_italic]
family = "CaskaydiaCove Nerd Font"
style = "Bold Italic"

[window]
opacity = 0.65
dynamic_padding = true

[window.padding]
x = 6
y = 2
